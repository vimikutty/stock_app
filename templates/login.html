<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #0f2027, #203a43, #000);
    color: white;
}

body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: url('https://images.unsplash.com/photo-1640161704729-cbe966a08476?auto=format&fit=crop&w=1470&q=80') no-repeat center/cover;
    opacity: 0.25;
    z-index: -1;
}

.container {
    text-align: center;
    max-width: 350px;
    width: 100%;
}

h1 {
    font-weight: 600;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 30px;
}

.card {
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,255,150,0.2);
}

.input-box {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.08);
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 12px;
}

.input-box input {
    background: none;
    border: none;
    outline: none;
    color: white;
    width: 100%;
}

.input-box i {
    margin-right: 10px;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #00ff99, #00ccff);
    color: black;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

.divider {
    margin: 20px 0;
    color: #aaa;
}

.socials {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.socials div {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.signup {
    margin-top: 15px;
    font-size: 14px;
}

.signup span {
    color: #00ff99;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="container">
    <h1>Predict the <br> Stock Market</h1>
    <p class="subtitle">Sign in to continue</p>

    <div class="card">

        <!-- ✅ FORM START -->
        <form action="/index" method="POST">

            <div class="input-box">
                <i>📧</i>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <i>🔒</i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button class="btn" type="submit">Sign In</button>

        </form>
        <!-- ✅ FORM END -->

        <div class="divider">or continue with</div>

        <div class="socials">
            <div>G</div>
            <div></div>
            <div>f</div>
        </div>

        <p class="signup">Don't have an account? <span>Sign Up</span></p>
    </div>
</div>

</body>
</html>
